title: Cherri Fork V2
description: Active V2 authoring guide for the davidpovarsky Cherri fork
url: "https://davidpovarsky.github.io"
baseurl: "/cherrilang.org"
theme: just-the-docs
logo: "/assets/cherri_logo.png"
favicon_ico: "/assets/cherri_icon.png"
color_scheme: cherri
callouts:
  warning:
    title: Warning
    color: yellow
  note:
    title: Note
    color: purple
  important:
    title: Important
    color: red

# mermaid:
  # Version of mermaid library
  # Pick an available version from https://cdn.jsdelivr.net/npm/mermaid/
#  version: "9.1.3"

aux_links:
  "Fork Source on GitHub":
    - "https://github.com/davidpovarsky/cherri"
aux_links_new_tab: true

nav_external_links:
  - title: Upstream project (reference)
    url: https://github.com/electrikmilk/cherri
    hide_icon: false
    opens_in_new_tab: true

# Search and navigation recommend the maintained fork guide. Archived upstream
# routes remain directly accessible for deliberate historical reference.
defaults:
  - scope:
      path: ""
    values:
      search_exclude: true
      nav_exclude: true
  - scope:
      path: "fork-language"
    values:
      search_exclude: false
      nav_exclude: false
  - scope:
      path: "index.md"
    values:
      search_exclude: false

exclude:
  - AGENTS.md
  - CLAUDE.md
  - PROJECT_BOARD.md
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - docs/ai-team/evidence/20261122-d10-s4-generation/d10-s4-generation-originals-20261122.zip

footer_content: "Copyright &copy;. Distributed under the <a href=\"https://github.com/electrikmilk/cherri/blob/main/LICENSE\">GPL-2.0 License.</a> Siri Shortcuts and Mac are registered trademarks of Apple Inc. Apple is not involved in this project in any way. Do not contact Apple Support unless you are having an issue with the Shortcuts app itself."

enable_copy_code_button: false

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

gh_edit_link: true
gh_edit_link_text: "Contribute to this page"
gh_edit_repository: "https://github.com/davidpovarsky/cherrilang.org"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"
