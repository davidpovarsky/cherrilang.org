# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BUNDLE_FROZEN: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Checkout
        uses: actions/checkout@v4
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.3' # Matches locked dependencies and build-only CI
          bundler: '2.5.11' # Matches Gemfile.lock and build-only CI
          bundler-cache: false # we'll run bundle commands explicitly to enforce lockfile and constraints
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Install locked site dependencies
        env:
          BUNDLE_PATH: ${{ runner.temp }}/cherri-docs-bundle
        run: bundle install --jobs 2 --retry 3
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Build with Jekyll
        run: bundle exec jekyll build --disable-disk-cache --baseurl "${{ steps.pages.outputs.base_path }}" --destination "$RUNNER_TEMP/cherri-docs-site"
        env:
          BUNDLE_PATH: ${{ runner.temp }}/cherri-docs-bundle
          JEKYLL_ENV: production
      - name: Verify the actual fork pages and default search
        run: python3 scripts/verify_site_artifacts.py --site "$RUNNER_TEMP/cherri-docs-site" --baseurl "${{ steps.pages.outputs.base_path }}" --evidence-out "$RUNNER_TEMP/cherri-docs-site-evidence.json"
      - name: Reject corrupted real site and search artifacts
        run: python3 scripts/test_site_artifacts.py --site "$RUNNER_TEMP/cherri-docs-site" --baseurl "${{ steps.pages.outputs.base_path }}" --evidence-out "$RUNNER_TEMP/cherri-docs-site-controls.json"
      - name: Retain publication build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-docs-build-evidence
          path: |
            ${{ runner.temp }}/cherri-docs-site-evidence.json
            ${{ runner.temp }}/cherri-docs-site-controls.json
          if-no-files-found: warn
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/cherri-docs-site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Live Activity · refresh
        uses: davidpovarsky/github-automation/live-refresh@main
        continue-on-error: true
        with:
          event: refresh
          device_id: ${{ secrets.NOTIFY_DEVICE_ID }}
          token: ${{ secrets.NOTIFY_DEVICE_TOKEN }}
          github_token: ${{ github.token }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
