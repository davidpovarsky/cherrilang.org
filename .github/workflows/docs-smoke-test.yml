name: Docs Snippet Smoke Test

on:
  push:
    branches:
      - "main"
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test-snippets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cherrilang.org
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run standalone docs snippet smoke test against pinned Cherri compiler
        run: python3 scripts/smoke_test_snippets.py
