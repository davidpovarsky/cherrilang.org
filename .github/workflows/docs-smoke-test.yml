name: Docs Snippet Smoke Test

on:
  push:
    branches:
      - "main"
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test-snippets:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout cherrilang.org
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run standalone docs snippet smoke test against pinned Cherri compiler
        env:
          CHERRI_SMOKE_CACHE_DIR: ${{ runner.temp }}/cherri-docs-compiler
        run: python3 scripts/smoke_test_snippets.py --evidence-out "$RUNNER_TEMP/cherri-docs-evidence.json"

      - name: Verify real compiler cache provenance and negative examples
        env:
          CHERRI_SMOKE_TEST_CACHE: ${{ runner.temp }}/cherri-docs-compiler
        run: python3 scripts/test_smoke_test_snippets.py

      - name: Retain bounded documentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-snippet-evidence
          path: ${{ runner.temp }}/cherri-docs-evidence.json
          if-no-files-found: warn
